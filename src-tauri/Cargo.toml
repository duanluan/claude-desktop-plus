[package]
name = "claude-desktop-plus"
version = "0.1.0"
description = "Claude Desktop Plus native shell"
authors = ["Claude Desktop Plus contributors"]
edition = "2021"

[lib]
name = "claude_desktop_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "claude-desktop-plus"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
fs_extra = "1.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"
tauri-plugin-opener = "2.5.0"
tauri-plugin-process = "2.3.0"
tauri-plugin-updater = "2.10.1"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros"] }
tungstenite = "0.28"

[dev-dependencies]
tempfile = "3.14"
